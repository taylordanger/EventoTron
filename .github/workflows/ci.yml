name: EventoTron CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject critical dependency advisories
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Type check
        run: npm run typecheck

      - name: Build and test
        run: npm test

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance checks against disposable database
        run: npm run verify:browser

      - name: Preserve browser screenshots and QA logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-acceptance-evidence
          path: |
            /tmp/eventotron-browser-*/*.png
            /tmp/eventotron-browser-*/wrangler.log
          if-no-files-found: ignore
